<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Production Line Display - TV Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            padding: 12px 18px 0 30px;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            text-align: center;
        }

        [x-cloak] {
            display: none !important;
        }

        .display-frame {
            width: 98%;
            height: calc(100vh - 12px);
            border-collapse: collapse;
            overflow: hidden;
        }

        .main-table {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        .main-table td,
        .main-table th {
            padding: 1px;
            border: 1px solid #fff;
            text-align: center;
            vertical-align: middle;
            color: #ffeb3b;
            font-weight: 900;
            word-wrap: break-word;
        }

        .line-cell {
            height: 66px;
            font-size: 24px;
            color: #ffeb3b;
        }

        .model-cell {
            height: 132px;
            font-size: 24px;
            color: #ffeb3b;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .week-cell {
            height: 66px;
            font-size: 20px;
            color: #ffeb3b;
        }

        .label-cell {
            height: 72px;
            background: #181818;
            color: #fff !important;
            font-size: 1.8em;
        }

        .metric-cell {
            height: 214px;
            font-size: 4.1em;
            line-height: 1;
            color: #000 !important;
        }

        .metric-target {
            background: #fff;
        }

        .metric-productivity {
            background: #ff0;
        }

        .metric-balance {
            background: #efc4ca;
        }

        .metric-defect {
            background: #ffd8d8;
        }

        .metric-green {
            color: green !important;
        }

        .metric-red {
            color: red !important;
        }

        .percent-cell {
            height: 130px;
            background: #add8e6;
            color: navy !important;
            font-size: 2.5em;
            line-height: 1;
            border-color: #000 !important;
        }

        .side-cell {
            width: 20%;
            padding: 1px !important;
            vertical-align: top !important;
            background: #111;
        }

        .date {
            font-size: 18px;
            font-weight: 900;
            color: #ffeb3b;
        }

        .clock {
            font-size: 20px;
            font-weight: 900;
            color: #00b0ff;
        }

        .histor,
        .table-defect {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .histor th,
        .table-defect th {
            border: 1px solid #666;
            background: #222;
            color: #fff;
            padding: 1px;
            font-size: 14px;
        }

        .histor td,
        .table-defect td {
            border: 1px solid #666;
            padding: 4px;
            font-size: 14px;
            font-weight: 900;
        }

        .hour-cell {
            color: #fff !important;
            font-size: 12px !important;
        }

        .hour-active {
            background: #ff0 !important;
            color: #000 !important;
        }

        .output-ok {
            color: #fff !important;
            font-size: 18px !important;
        }

        .output-ng {
            color: #ff1a1a !important;
            font-size: 18px !important;
        }

        .top-defect-title {
            text-align: center;
            font-size: 16px !important;
        }

        .footer-control {
            position: fixed;
            right: 10px;
            bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ccc;
            font-size: 12px;
            opacity: 0.4;
        }

        .footer-control select {
            background: #222;
            color: #fff;
            border: 1px solid #666;
            font-size: 12px;
        }

        .error-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.9);
        }

        .error-content {
            width: 420px;
            border: 1px solid #666;
            background: #222;
            padding: 24px;
        }

        .error-title {
            color: #ff1a1a;
            margin: 0 0 12px;
        }

        .error-message {
            color: #fff;
            margin-bottom: 16px;
        }

        .error-button {
            border: 1px solid #fff;
            background: #111;
            color: #fff;
            padding: 8px 14px;
            cursor: pointer;
        }
    </style>
</head>
<body x-data="publicDisplay()" x-cloak>
    <div class="display-frame">
        <table class="main-table" border="0">
            <tbody>
                <tr>
                    <td class="line-cell" x-text="'LINE: ' + (lineData.name || 'Loading...')"></td>
                    <td colspan="2" rowspan="2" class="model-cell" x-text="lineData.data.model || 'Loading...'"></td>
                    <td rowspan="7" class="side-cell">
                        <table class="histor">
                            <thead>
                                <tr><td colspan="3"><div class="date" id="current-date">Loading...</div></td></tr>
                                <tr><td colspan="3"><div class="clock" id="current-clock">--:--:--</div></td></tr>
                                <tr><td colspan="3" style="font-size:14px;color:#fff" x-text="'TARGET : ' + formatNumber(getCurrentHourTarget())"></td></tr>
                                <tr>
                                    <th>JAM</th>
                                    <th>GOOD</th>
                                    <th>DEFECT</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="hour in displayHours" :key="hour.hour">
                                    <tr>
                                        <td class="hour-cell" :class="{'hour-active': isActiveHour(hour)}" x-text="compactHour(hour.hour)"></td>
                                        <td :class="hourlyOutputClass(hour)" x-text="formatNumber(hour.output || 0)"></td>
                                        <td :class="hourlyDefectClass(hour)" x-text="formatNumber(hour.defect || 0)"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <table class="table-defect" style="margin-top:5px;color:white;font-weight:bold;">
                            <thead>
                                <tr><th colspan="3" class="top-defect-title">TOP 3 DEFECT</th></tr>
                            </thead>
                            <tbody>
                                <template x-for="(item, index) in topDefects" :key="index">
                                    <tr>
                                        <td style="width:20%;" x-text="index + 1"></td>
                                        <td style="text-align:left" x-text="item.name"></td>
                                        <td style="width:20%;" x-text="item.count"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td class="week-cell" x-text="'WEEK : ' + (lineData.data.labelWeek || '-')"></td>
                </tr>
                <tr>
                    <td class="label-cell">TARGET</td>
                    <td class="label-cell">BALANCE</td>
                    <td class="label-cell">PRODUCTIVITY</td>
                </tr>
                <tr>
                    <td class="metric-cell metric-target" x-text="formatNumber(getCurrentHourTarget())"></td>
                    <td class="metric-cell metric-balance" :class="calculateCumulativeBalance() < 0 ? 'metric-red' : 'metric-green'" x-text="formatNumber(calculateCumulativeBalance())"></td>
                    <td class="metric-cell metric-productivity" x-text="formatNumber(lineData.data.outputDay || 0)"></td>
                </tr>
                <tr>
                    <td class="percent-cell" x-text="calculateTargetProgressPercentage() + '%'"></td>
                    <td class="percent-cell" x-text="calculateCumulativeBalancePercentage() + '%'"></td>
                    <td class="percent-cell" x-text="calculateOutputPercentage() + '%'"></td>
                </tr>
                <tr>
                    <td colspan="2" class="label-cell">ACT DEFECT</td>
                    <td class="label-cell">DEFECT %</td>
                </tr>
                <tr>
                    <td colspan="2" class="metric-cell metric-defect" :class="(lineData.data.defectRatePercentage || 0) > 3 ? 'metric-red' : 'metric-green'" x-text="formatNumber(lineData.data.actualDefect || 0)"></td>
                    <td class="metric-cell metric-defect" :class="(lineData.data.defectRatePercentage || 0) > 3 ? 'metric-red' : 'metric-green'" x-text="formatPercent(lineData.data.defectRatePercentage || 0)"></td>
                </tr>
            </tbody>
        </table>

        <div class="footer-control">
            <span>Auto Refresh</span>
            <select x-model="refreshInterval" @change="changeRefreshInterval">
                <option value="0">Mati</option>
                <option value="5000">5 Detik</option>
                <option value="10000">10 Detik</option>
                <option value="30000">30 Detik</option>
                <option value="60000">1 Menit</option>
            </select>
        </div>
    </div>

    <!-- Error Overlay -->
    <template x-if="errorMessage">
        <div class="error-overlay">
            <div class="error-content">
                <h2 class="error-title">Error</h2>
                <p class="error-message" x-text="errorMessage"></p>
                <button class="error-button" @click="errorMessage = ''">Tutup</button>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script>
        function publicDisplay() {
            return {
                lineData: {
                    name: '',
                    data: {
                        labelWeek: '',
                        model: '',
                        date: '',
                        target: 0,
                        targetPerHour: 0,
                        outputDay: 0,
                        qcChecking: 0,
                        actualDefect: 0,
                        defectRatePercentage: 0,
                        hourly_data: [],
                        operators: []
                    }
                },
                currentModelId: '',
                errorMessage: '',
                refreshInterval: 10000,
                refreshTimer: null,
                dataUpdated: false,

                async init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const lineName = urlParams.get('line');
                    const modelId = urlParams.get('model');
                    
                    if (!lineName) {
                        this.errorMessage = 'Parameter line tidak ditemukan. Gunakan format: public-display.html?line=NAMA_LINE&model=MODEL_ID';
                        return;
                    }

                    this.lineData.name = lineName;
                    this.currentModelId = modelId || '';
                    await this.loadLineData();
                    
                    this.setupAutoRefresh();
                    
                    this.updateDateTime();
                    setInterval(() => {
                        this.updateDateTime();
                    }, 1000);
                    
	                },

                async loadLineData() {
                    try {
                        let url;
                        if (this.currentModelId) {
                            url = `/api/public/line/${this.lineData.name}/${this.currentModelId}`;
                        } else {
                            url = `/api/public/line/${this.lineData.name}`;
                        }
                        
                        let response = await fetch(url);
                        
                        if (!response.ok) {
                            response = await fetch(`/api/line/${this.lineData.name}${this.currentModelId ? '/' + this.currentModelId : ''}`);
                        }
                        
                        if (response.ok) {
                            const data = await response.json();
                            this.lineData.data = data;
                            this.errorMessage = '';
                            
                            this.dataUpdated = true;
                            setTimeout(() => {
                                this.dataUpdated = false;
                            }, 1000);
                        } else {
                            const error = await response.json();
                            this.errorMessage = error.error || 'Gagal memuat data line';
                        }
                    } catch (error) {
                        console.error('Error loading line data:', error);
                        this.errorMessage = 'Terjadi kesalahan saat memuat data';
                    }
                },

                setupAutoRefresh() {
                    if (this.refreshTimer) {
                        clearInterval(this.refreshTimer);
                    }

                    if (this.refreshInterval > 0) {
                        this.refreshTimer = setInterval(() => {
                            this.loadLineData();
                        }, this.refreshInterval);
                    }
                },

                changeRefreshInterval() {
                    this.refreshInterval = Number(this.refreshInterval) || 0;
                    this.setupAutoRefresh();
                },
                
	                updateDateTime() {
	                    const now = new Date();
	                    const dateEl = document.getElementById('current-date');
	                    const clockEl = document.getElementById('current-clock');
	                    if (dateEl) {
	                        dateEl.textContent = now.toLocaleDateString('id-ID', {
	                            weekday: 'long',
	                            day: '2-digit',
	                            month: 'short',
	                            year: 'numeric'
	                        });
	                    }
	                    if (clockEl) {
	                        clockEl.textContent = now.toLocaleTimeString('id-ID', {
	                            hour: '2-digit',
	                            minute: '2-digit',
	                            second: '2-digit'
	                        });
	                    }
	                },
                
	                getCurrentTimeInMinutes() {
                    const now = new Date();
                    return now.getHours() * 60 + now.getMinutes();
                },

                parseHourRange(hourRange) {
                    if (!hourRange || typeof hourRange !== 'string') {
                        return null;
                    }

                    const [start, end] = hourRange.split(' - ');
                    if (!start || !end) {
                        return null;
                    }

                    const [startHour, startMinute] = start.split(':').map(Number);
                    const [endHour, endMinute] = end.split(':').map(Number);

                    return {
                        start: (startHour * 60) + startMinute,
                        end: (endHour * 60) + endMinute
                    };
                },

                getActiveHourData() {
                    if (!this.lineData.data.hourly_data || this.lineData.data.hourly_data.length === 0) {
                        return null;
                    }

                    const currentTime = this.getCurrentTimeInMinutes();
                    for (const hour of this.lineData.data.hourly_data) {
                        const range = this.parseHourRange(hour.hour);
                        if (!range) {
                            continue;
                        }

                        if (currentTime >= range.start && currentTime < range.end) {
                            return hour;
                        }
                    }

                    return null;
                },

                reduceHoursUntilCurrent(reducer, initialValue) {
                    if (!this.lineData.data.hourly_data || this.lineData.data.hourly_data.length === 0) {
                        return initialValue;
                    }

                    const currentTime = this.getCurrentTimeInMinutes();
                    return this.lineData.data.hourly_data.reduce((acc, hour) => {
                        const range = this.parseHourRange(hour.hour);
                        if (!range || currentTime < range.start) {
                            return acc;
                        }

                        return reducer(acc, hour);
                    }, initialValue);
                },
                
                getCurrentHourTarget() {
                    const activeHour = this.getActiveHourData();
                    return activeHour ? (activeHour.targetManual || 0) : 0;
                },
                
                getCurrentHourRange() {
                    const activeHour = this.getActiveHourData();
                    return activeHour ? activeHour.hour : 'No active hour';
                },
                
                calculateCurrentHourBalance() {
                    const activeHour = this.getActiveHourData();
                    if (!activeHour) return 0;
                    return (activeHour.output || 0) - (activeHour.targetManual || 0);
                },
                
                calculateCumulativeBalance() {
                    return this.reduceHoursUntilCurrent((acc, hour) => {
                        return acc + ((hour.output || 0) - (hour.targetManual || 0));
                    }, 0);
                },
                
                calculateCumulativeBalancePercentage() {
                    const dailyTarget = this.lineData.data.target || 0;
                    if (!dailyTarget || dailyTarget === 0) return '0.0';
                    
                    const cumulativeBalance = this.calculateCumulativeBalance();
                    // Rumus: (Balance Akumulasi / Total Target 8 Jam) × 100%
                    const percentage = (cumulativeBalance / dailyTarget) * 100;
                    
                    return percentage.toFixed(1);
                },
                
                calculateTargetProgressPercentage() {
                    if (!this.lineData.data.target || this.lineData.data.target === 0) return '0.0';
                    
                    const cumulativeTarget = this.calculateCumulativeTarget();
                    const percentage = (cumulativeTarget / this.lineData.data.target) * 100;
                    
                    return percentage > 100 ? '100.0' : percentage.toFixed(1);
                },
                
                calculateCumulativeTarget() {
                    return this.reduceHoursUntilCurrent((acc, hour) => {
                        return acc + (hour.targetManual || 0);
                    }, 0);
                },
                
                calculateCumulativeOutput() {
                    return this.reduceHoursUntilCurrent((acc, hour) => {
                        return acc + (hour.output || 0);
                    }, 0);
                },
                
	                calculateOutputPercentage() {
	                    if (!this.lineData.data.target || this.lineData.data.target === 0) return '0.0';
	                    return ((this.lineData.data.outputDay || 0) / this.lineData.data.target * 100).toFixed(1);
	                },

	                formatNumber(value) {
	                    return (parseInt(value) || 0).toLocaleString('id-ID');
	                },

	                formatPercent(value) {
	                    return `${(parseFloat(value) || 0).toFixed(1)}%`;
	                },

	                compactHour(value) {
	                    return String(value || '-').replace(/\s+/g, '');
	                },

	                isActiveHour(hour) {
	                    const activeHour = this.getActiveHourData();
	                    return activeHour && activeHour.hour === hour.hour;
	                },

	                hourlyOutputClass(hour) {
	                    return (parseInt(hour.output) || 0) >= (parseInt(hour.targetManual) || 0) ? 'output-ok' : 'output-ng';
	                },

	                hourlyDefectClass(hour) {
	                    const output = parseInt(hour.output) || 0;
	                    const defect = parseInt(hour.defect) || 0;
	                    const rate = output + defect > 0 ? (defect / (output + defect)) * 100 : 0;
	                    return rate >= 3 ? 'output-ng' : 'output-ok';
	                },

	                get displayHours() {
	                    return (this.lineData.data.hourly_data || []).slice(0, 10);
	                },

	                get topDefects() {
	                    const counts = {};

	                    (this.lineData.data.hourly_data || []).forEach(hour => {
	                        (hour.defectDetails || []).forEach(detail => {
	                            const name = detail.type || '-';
	                            counts[name] = (counts[name] || 0) + (parseInt(detail.quantity) || 1);
	                        });
	                    });

	                    (this.lineData.data.qcChecks || [])
	                        .filter(check => check.result === 'defect')
	                        .forEach(check => {
	                            const name = check.type || '-';
	                            counts[name] = (counts[name] || 0) + 1;
	                        });

	                    const items = Object.entries(counts)
	                        .map(([name, count]) => ({ name, count }))
	                        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name))
	                        .slice(0, 3);

	                    while (items.length < 3) {
	                        items.push({ name: '-', count: '-' });
	                    }

	                    return items;
	                }
	            }
	        }
        
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Alpine === 'undefined') {
                console.error('Alpine.js tidak terdeteksi. Pastikan sudah dimuat.');
            }
        });
    </script>
</body>
</html>
